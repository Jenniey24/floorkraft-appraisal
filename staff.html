<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Console — Performance & Appraisal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Staff <span>Console</span></div>
  <div class="flex">
    <span class="who" id="whoName"></span>
    <a class="logout" onclick="logout()">Log out</a>
  </div>
</header>
<div class="wrap">
  <div id="demoNote" class="note hidden">Demo mode — actions are simulated in this browser only. No real emails are sent.</div>

  <div class="tabs">
    <button class="active" data-tab="current" onclick="showTab('current')" id="tabCurrentBtn">My Current Period</button>
    <button data-tab="history" onclick="showTab('history')">My History</button>
    <button data-tab="suggest" onclick="showTab('suggest')">Suggestion Box</button>
  </div>

  <div id="pane-current" class="pane">
    <div class="card" id="statusCard"></div>
    <div class="card hidden" id="entryCard"></div>
  </div>

  <div id="pane-history" class="pane hidden">
    <div class="card"><h2>My History</h2><div id="historyList"></div></div>
  </div>

  <div id="pane-suggest" class="pane hidden">
    <div class="card">
      <h2>Suggestion Box</h2>
      <p class="muted">Tell HR what would help you (or the team) perform better — training, tools, process changes, anything.</p>
      <label>Category</label>
      <select id="sugCategory">
        <option>General</option><option>Training</option><option>Tools/Equipment</option>
        <option>Process</option><option>Management</option><option>Wellbeing</option>
      </select>
      <label>Your suggestion</label>
      <textarea id="sugText"></textarea>
      <label class="flex"><input type="checkbox" id="sugAnon" style="width:auto;"> Submit anonymously</label>
      <button class="btn" style="margin-top:10px;" onclick="submitSuggestion()">Submit Suggestion</button>
      <div class="error" id="sugErr"></div>
      <div id="sugOk" class="muted hidden" style="color:var(--good);margin-top:8px;">Thank you — your suggestion has been sent to HR.</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
let CURRENT = JSON.parse(sessionStorage.getItem('currentStaff') || 'null');
if (!CURRENT) window.location.href = 'index.html';
document.getElementById('whoName').innerText = CURRENT.Name + ' · ' + CURRENT.StaffID;
document.getElementById('demoNote').classList.toggle('hidden', !DEMO_MODE);
function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }
function esc(s){ return String(s||'').replace(/"/g,'&quot;'); }
function fmtDate(d) { if(!d) return '—'; const dt = new Date(d); return isNaN(dt) ? d : dt.toLocaleDateString(); }

function showTab(name) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.pane').forEach(p => p.classList.add('hidden'));
  document.getElementById('pane-'+name).classList.remove('hidden');
  if (name==='history') renderHistory();
}

let DASH = null;
async function load() {
  DASH = await Api.get('staffDashboard', { staffId: CURRENT.StaffID });
  renderStatus();
  renderCurrentEntry();
}
load();

function statusBadge(status) {
  const cls = status==='PIP' ? 'pip' : status==='Probation' ? 'probation' : 'active';
  return `<span class="badge ${cls}">${status}</span>`;
}

function renderStatus() {
  const s = DASH.staff;
  let html = `<h2>Hello, ${esc(s.Name)} ${statusBadge(s.Status)}</h2>`;
  if (DASH.cycle) {
    const c = DASH.cycle;
    if (c.Type === 'Probation') {
      html += `<p class="muted">Probation started ${fmtDate(c.StartDate)} · Month ${c.CurrentPeriod} of ${c.DurationMonths} · Ends ${fmtDate(c.EndDate)}${c.Status==='Extended'?' (Extended)':''}</p>`;
    } else if (c.Type === 'PIP') {
      html += `<p class="muted">PIP started ${fmtDate(c.StartDate)} · Ends ${fmtDate(c.EndDate)}${c.Status==='Extended'?' (Extended)':''}${c.Reason?(' · Reason: '+esc(c.Reason)):''}</p>`;
    }
    if (c.Notes) html += `<p class="small muted">${esc(c.Notes)}</p>`;
  } else {
    html += `<p class="muted">You are on the standard monthly appraisal track.</p>`;
  }
  document.getElementById('statusCard').innerHTML = html;
}

function latestOpenEntry() {
  // entry HR has built objectives for, awaiting the staff's Actuals/Comment, or already submitted-but-not-yet-signed (still viewable/editable pre-submit only)
  const open = DASH.entries.filter(e => e.Status === 'AwaitingStaff');
  if (open.length) return open.sort((a,b)=> (b.PeriodLabel||'').localeCompare(a.PeriodLabel||''))[0];
  return null;
}

function renderCurrentEntry() {
  const entryCard = document.getElementById('entryCard');
  const entry = latestOpenEntry();
  if (!entry) {
    entryCard.classList.remove('hidden');
    entryCard.innerHTML = `<h3>No objectives awaiting your response right now.</h3><p class="muted">Once HR sets your objectives and targets for the next period, they'll appear here for you to fill in your Actual results.</p>`;
    return;
  }
  entryCard.classList.remove('hidden');
  const rows = entry.objectives.map(o => `
    <tr>
      <td>${esc(o.Objective)}</td>
      <td>${esc(o.KeyResult)}</td>
      <td>${esc(o.Unit)}</td>
      <td>${o.Weight}%</td>
      <td>${o.Target}</td>
      <td><input class="cell actual" data-oid="${o.ObjectiveID}" data-target="${o.Target}" type="number" style="width:90px" placeholder="Actual"></td>
      <td class="achv-${o.ObjectiveID} muted">—</td>
    </tr>
    <tr>
      <td colspan="7"><textarea class="comment" data-oid="${o.ObjectiveID}" placeholder="Your comment on this objective (what happened, why, context)..." style="min-height:50px;"></textarea></td>
    </tr>`).join('');
  entryCard.innerHTML = `
    <h2>${esc(entry.PeriodLabel)}</h2>
    <p class="muted">These objectives and targets were set by HR. Fill in your Actual and a short comment for each — the Achievement % calculates automatically.</p>
    <table><thead><tr><th>Objective</th><th>Key Result</th><th>Unit</th><th>Weight</th><th>Target</th><th>Actual</th><th>Achv%</th></tr></thead>
    <tbody id="entryRows">${rows}</tbody></table>
    <div class="right" style="margin-top:8px;">Live overall score: <b id="livePreview" class="score-pill">0%</b></div>
    <button class="btn" style="margin-top:14px;" onclick="submitEntry('${entry.EntryID}')">Submit to HR</button>
    <div class="error" id="entryErr"></div>`;

  document.querySelectorAll('#entryRows .actual').forEach(inp => inp.addEventListener('input', recalcPreview));
  recalcPreview();
}

function recalcPreview() {
  const rows = document.querySelectorAll('#entryRows tr').length;
  let weighted = 0;
  document.querySelectorAll('#entryRows .actual').forEach(inp => {
    const target = parseFloat(inp.dataset.target) || 0;
    const actual = parseFloat(inp.value) || 0;
    const achv = target ? Math.round((actual/target*100)*10)/10 : 0;
    const cell = document.querySelector('.achv-'+inp.dataset.oid);
    if (cell) cell.innerText = inp.value ? achv + '%' : '—';
  });
  // weight lookup from the current open entry's objectives
  const entry = latestOpenEntry();
  if (!entry) return;
  entry.objectives.forEach(o => {
    const inp = document.querySelector(`.actual[data-oid="${o.ObjectiveID}"]`);
    if (!inp) return;
    const actual = parseFloat(inp.value) || 0;
    const achv = o.Target ? (actual/o.Target*100) : 0;
    weighted += achv * (parseFloat(o.Weight)||0)/100;
  });
  document.getElementById('livePreview').innerText = (Math.round(weighted*10)/10) + '%';
}

async function submitEntry(entryId) {
  const errEl = document.getElementById('entryErr'); errEl.innerText = '';
  const actuals = Array.from(document.querySelectorAll('#entryRows .actual')).map(inp => ({
    objectiveId: inp.dataset.oid,
    actual: inp.value,
    comment: document.querySelector(`.comment[data-oid="${inp.dataset.oid}"]`).value
  }));
  if (actuals.some(a => a.actual === '')) {
    if (!confirm('Some objectives have no Actual entered — submit anyway?')) return;
  }
  const res = await Api.post('submitEntry', { entryId, staffId: CURRENT.StaffID, actuals });
  if (res.error) { errEl.innerText = res.error; return; }
  alert('Submitted! Overall score: ' + res.overallScore + '%. HR will review and you\'ll get an email with the result.' + (res.demoNote?(' ('+res.demoNote+')'):''));
  load();
}

/* ---------------- HISTORY ---------------- */
function objectivesTableHtml(objs) {
  if (!objs || !objs.length) return '';
  return `<table style="margin:8px 0;"><thead><tr><th>Objective</th><th>Key Result</th><th>Unit</th><th>Wt%</th><th>Target</th><th>Actual</th><th>Achv%</th><th>Your Comment</th></tr></thead>
  <tbody>${objs.map(O=>`<tr><td>${esc(O.Objective)}</td><td>${esc(O.KeyResult)}</td><td>${esc(O.Unit)}</td><td>${O.Weight}</td><td>${O.Target}</td><td>${O.Actual}</td><td><b>${O.Achv}%</b></td><td>${esc(O.EmployeeComment)}</td></tr>`).join('')}</tbody></table>`;
}
function renderHistory() {
  const list = document.getElementById('historyList');
  const done = DASH.entries.filter(E => E.Status !== 'AwaitingStaff').sort((A,B)=>(B.SubmittedDate||'').localeCompare(A.SubmittedDate||''));
  if (!done.length) { list.innerHTML = '<p class="muted">No submissions yet.</p>'; return; }
  list.innerHTML = done.map(E => `
    <div class="card" style="background:#fafbfd;">
      <div class="flex between"><h3 style="margin:0;">${esc(E.PeriodLabel)}</h3><span class="badge ${(E.Status||'').toLowerCase()}">${E.Status}</span></div>
      <p class="small muted">Overall score: <b>${E.OverallScore}%</b></p>
      ${objectivesTableHtml(E.objectives)}
    </div>`).join('');
  const reviews = DASH.finalReviews || [];
  if (reviews.length) {
    list.innerHTML += `<h3 style="margin-top:20px;">Final Reviews</h3>` + reviews.map(R => `
      <div class="card" style="background:#FFFBEA;">
        <div class="flex between"><b>${esc(R.Type)} — ${esc(R.Decision)}</b><span class="small muted">${fmtDate(R.ReviewedDate)}</span></div>
        <p class="small">${esc(R.Summary)}</p>
        ${R.ImprovementPlan?`<p class="small"><b>Improvement Plan:</b> ${esc(R.ImprovementPlan)}</p>`:''}
      </div>`).join('');
  }
}

/* ---------------- SUGGESTIONS ---------------- */
async function submitSuggestion() {
  const text = document.getElementById('sugText').value.trim();
  const errEl = document.getElementById('sugErr'); errEl.innerText='';
  if (!text) { errEl.innerText = 'Write your suggestion first.'; return; }
  await Api.post('addSuggestion', {
    staffId: CURRENT.StaffID, staffName: CURRENT.Name, text,
    category: document.getElementById('sugCategory').value, anonymous: document.getElementById('sugAnon').checked
  });
  document.getElementById('sugText').value = '';
  document.getElementById('sugOk').classList.remove('hidden');
}
</script>
</body>
</html>
